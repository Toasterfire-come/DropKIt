# MongoDB configuration for production security
storage:
  dbPath: /data/db
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.25
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
  logRotate: reopen
  component:
    accessControl:
      verbosity: 1
    command:
      verbosity: 1

net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 100
  compression:
    compressors: snappy,zstd

security:
  authorization: enabled
  clusterAuthMode: keyFile

processManagement:
  timeZoneInfo: /usr/share/zoneinfo

operationProfiling:
  slowOpThresholdMs: 100
  mode: slowOp

# Security: Disable JavaScript execution
security:
  javascriptEnabled: false

# Audit logging for security compliance
auditLog:
  destination: file
  format: JSON
  path: /var/log/mongodb/audit.log
