<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="theme-color" content="#0D1117" />
        <meta name="color-scheme" content="dark" />

        <!-- Primary SEO -->
        <title>DropKit — Open-source hardware projects, delivered monthly</title>
        <meta name="description" content="A curated open-source electronics project, every month. Microcontroller, all components, full guide, and a community vote on what comes next. $40 / month · MIT &amp; CC BY-SA · US shipping." />
        <meta name="keywords" content="hardware subscription, electronics kit, monthly maker box, open-source hardware, microcontroller project, DIY electronics, RP2040, ATECC608A, SafeKeyVault, soldering kit, PCB project, embedded project, hacker box, monthly project box, electronics for makers" />
        <meta name="author" content="DropKit" />
        <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
        <meta name="googlebot" content="index, follow" />
        <link rel="canonical" href="https://dropkit.me/" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="DropKit" />
        <meta property="og:title" content="DropKit — Open-source hardware, delivered monthly" />
        <meta property="og:description" content="A curated open-source electronics project, every month. Microcontroller, all components, full guide, and a community vote on what comes next." />
        <meta property="og:url" content="https://dropkit.me/" />
        <meta property="og:image" content="https://dropkit.me/og-image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="DropKit — circuit-board art on dark background with the wordmark." />
        <meta property="og:locale" content="en_US" />

        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:site" content="@dropkitmarketing" />
        <meta name="twitter:creator" content="@dropkitmarketing" />
        <meta name="twitter:title" content="DropKit — Open-source hardware, delivered monthly" />
        <meta name="twitter:description" content="A curated open-source electronics project, every month. $40/mo for board, components, guide." />
        <meta name="twitter:image" content="https://dropkit.me/og-image.png" />
        <meta name="twitter:image:alt" content="DropKit — circuit-board art on dark background." />

        <!-- PWA / app icons -->
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.json" />

        <!-- Crawler hints -->
        <link rel="alternate" type="application/rss+xml" title="DropKit · Projects" href="/feed.xml" />
        <link rel="sitemap" type="application/xml" title="DropKit sitemap" href="/sitemap.xml" />

        <!-- Performance: preconnect to fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="dns-prefetch" href="/" />

        <!-- Fonts — single family kept; system fonts are the primary stack -->
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

        <!-- JSON-LD: Organization -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "name": "DropKit",
          "url": "https://dropkit.me",
          "logo": "https://dropkit.me/logo.png",
          "description": "Open-source hardware projects, delivered monthly. $40/mo subscription with full board, components, and build guide.",
          "sameAs": [
            "https://github.com/Toasterfire-come/DropKit-Projects",
            "https://discord.gg/QZgJssxK",
            "https://www.instagram.com/dropkit.marketing/",
            "https://www.tiktok.com/@dropkitmarketing",
            "https://www.youtube.com/@DropKit-marketing"
          ]
        }
        </script>

        <!-- JSON-LD: WebSite (enables sitelinks search) -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "DropKit",
          "url": "https://dropkit.me",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://dropkit.me/projects?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
        </script>

        <!-- JSON-LD: Product (subscription) -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Product",
          "name": "DropKit — Monthly Hardware Project Box",
          "image": "https://dropkit.me/og-image.png",
          "description": "Curated open-source electronics project shipped monthly. Microcontroller, all components, build guide, and community vote on next month's kit.",
          "brand": { "@type": "Brand", "name": "DropKit" },
          "offers": {
            "@type": "Offer",
            "url": "https://dropkit.me/subscribe",
            "priceCurrency": "USD",
            "price": "40.00",
            "priceValidUntil": "2027-12-31",
            "availability": "https://schema.org/PreOrder",
            "areaServed": { "@type": "Country", "name": "United States" }
          }
        }
        </script>
    </head>
    <body>
