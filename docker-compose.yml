version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: dropkit-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - dropkit-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dropkit-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://admin:password@mongodb:27017/dropkit?authSource=admin
      - JWT_SECRET=your-jwt-secret-here
      - FRONTEND_URL=https://dropkit.me
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
    networks:
      - dropkit-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dropkit-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=https://dropkit.me/api
      - REACT_APP_FRONTEND_URL=https://dropkit.me
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - dropkit-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: dropkit-tunnel
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared
    depends_on:
      - backend
      - frontend
    networks:
      - dropkit-network

volumes:
  mongodb_data:

networks:
  dropkit-network:
    driver: bridge
