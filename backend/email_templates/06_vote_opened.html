<!-- Klaviyo metric: "Vote Opened"
     Event properties: first_name, cycle_label, candidates (array of {title,board,difficulty}),
                       vote_url, closes_at
-->
<p style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#E8510A;letter-spacing:0.15em;text-transform:uppercase;margin:0 0 12px;">// COMMUNITY VOTE · {{ event.cycle_label }}</p>
<h1 style="font-family:'Space Grotesk',Helvetica,Arial,sans-serif;font-size:30px;line-height:1.1;font-weight:700;margin:0 0 16px;">
  Pick the next DropKit, {{ event.first_name|default:'Maker' }}.
</h1>
<p style="margin:0 0 20px;color:#F0F0EE;">
  Voting is open for two months out. Closes <strong>{{ event.closes_at|slice:":10" }}</strong>.
</p>

{% for c in event.candidates %}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#21262D;border:1px solid #30363D;margin:0 0 10px;">
  <tr>
    <td style="padding:14px 18px;">
      <p style="margin:0;font-family:'Space Grotesk',Helvetica,Arial,sans-serif;font-weight:700;font-size:16px;">{{ c.title }}</p>
      <p style="margin:4px 0 0;font-family:'JetBrains Mono',monospace;font-size:12px;color:#8B949E;">
        {{ c.difficulty }} · {{ c.board }}
      </p>
    </td>
  </tr>
</table>
{% endfor %}

<a href="{{ event.vote_url }}"
   style="display:inline-block;margin-top:16px;background:#E8510A;color:#0D1117;font-weight:600;font-size:14px;padding:12px 22px;text-decoration:none;">
  Cast my vote →
</a>
